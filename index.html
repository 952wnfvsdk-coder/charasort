<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        .progress-info {
            font-size: 11px;
            color: #000000;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        .sort-box {
            width: 140px;
            height: 160px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            width: 100px;
            height: 77px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            padding: 8px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        #resultArea {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        로딩 중...
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

    <script>
   
   <script>
    // 플레이브 노래 목록 (33곡이든 몇 곡이든 자유롭게 채워 넣으시면 됩니다)
    const songs = [
        "기다릴게", 
        "Pixel World", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "우리 영화", 
        "From", 
        "Merry PLLImas", 
        "달랐을까", 
        "Watch Me Woo!",
        "버추얼 아이돌",
        "Pump Up The Volume!",
        "WAY 4 LUV",
        "멈추지 않아",
        "Chroma Drift",
        "Dash",
    "RIZZ",
    "Island",
    "12:32 (A to T)",
    "Hide and Seek",
    "RIZZ (Japanese ver.)",
    "Chroma Drift (Japanese ver.)",
    "숨바꼭질",
    "BBUU!",
    "봉숭아",
    "BBUU! (Christmas ver.)",
    "이 밤을 빌려 말해요",
    "흥흥흥 (feat. SOLE)",
    "꽃송이들의 퍼레이드",
    "Born Savage",
    "Lunar Hearts",
    "그런 것 같아"
    ];

    let battleNo = 1;
    let scoreMap = {};
    let totalBattles = 0;
    let battlePairs = [];
    let currentPairIndex = 0;

    function initSorter() {
        songs.forEach(song => { scoreMap[song] = 0; });

        let rawPairs = [];
        // 1. 모든 가능한 대결 조합을 '순서가 항상 일정하게' 생성 (고정 레일 생성)
        for (let i = 0; i < songs.length; i++) {
            for (let j = i + 1; j < songs.length; j++) {
                rawPairs.push([i, j]);
            }
        }

        // 2. 다른 아이돌 소터처럼 매번 똑같은 순서로 흩어지도록 고정된 규칙(결정론적 규칙)으로 분산 배열
        // 랜덤(Math.random)을 쓰지 않고 수학적 간격을 두어 섞기 때문에, 새로고침해도 이 섞인 순서는 항상 똑같습니다!
        let visited = new Array(rawPairs.length).fill(false);
        let lastLeft = -1, lastRight = -1;

        for (let iter = 0; iter < rawPairs.length; iter++) {
            let found = false;
            // 직전 판에 나왔던 곡 번호들과 겹치지 않는 가장 가까운 대진 카드를 탐색
            for (let i = 0; i < rawPairs.length; i++) {
                if (!visited[i]) {
                    let p = rawPairs[i];
                    if (p[0] !== lastLeft && p[0] !== lastRight && p[1] !== lastLeft && p[1] !== lastRight) {
                        battlePairs.push(p);
                        visited[i] = true;
                        lastLeft = p[0];
                        lastRight = p[1];
                        found = true;
                        break;
                    }
                }
            }
            // 만약 남은 카드 중 조건에 맞는 게 없다면 가장 앞에 있는 남은 카드를 강제 배치
            if (!found) {
                for (let i = 0; i < rawPairs.length; i++) {
                    if (!visited[i]) {
                        let p = rawPairs[i];
                        battlePairs.push(p);
                        visited[i] = true;
                        lastLeft = p[0];
                        lastRight = p[1];
                        break;
                    }
                }
            }
        }

        totalBattles = battlePairs.length;
        showBattle();
    }

    function showBattle() {
        if (currentPairIndex >= totalBattles) {
            finishSorter();
            return;
        }

        let pair = battlePairs[currentPairIndex];
        document.getElementById("leftTitle").textContent = songs[pair[0]];
        document.getElementById("rightTitle").textContent = songs[pair[1]];

        // 33곡 기준 약 500판이 넘는 정밀하고 묵직한 정통 소터 분량 확보
        let progress = Math.floor((currentPairIndex / totalBattles) * 100);
        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        if (currentPairIndex >= totalBattles) return;

        let pair = battlePairs[currentPairIndex];
        let leftSong = songs[pair[0]];
        let rightSong = songs[pair[1]];

        if (choice === 1) {
            scoreMap[leftSong] += 2;
            scoreMap[rightSong] -= 1;
        } else if (choice === 2) {
            scoreMap[rightSong] += 2;
            scoreMap[leftSong] -= 1;
        } else {
            scoreMap[leftSong] += 1;
            scoreMap[rightSong] += 1;
        }

        battleNo++;
        currentPairIndex++;
        showBattle();
    }

    function finishSorter() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        let rankedSongs = songs.map(song => {
            return { name: song, score: scoreMap[song] };
        }).sort((a, b) => b.score - a.score);

        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };
        
</script>
</body>
</html>
