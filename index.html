<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        /* 엔하이픈 소터와 100% 일치하는 정밀 리사이징 디자인 */
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px; /* 전체 틀을 아담하게 축소 */
            padding: 20px;
            box-sizing: border-box;
        }

        /* [수정] 상단 배틀 정보 글씨 크기 축소 및 간격 조절 */
        .progress-info {
            font-size: 14px;
            color: #000000;
            margin-bottom: 15px; /* 박스들과 딱 예쁜 간격으로 밀착 */
            line-height: 1.4;
        }

        /* 메인 대결 레이아웃 */
        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; /* 엔하이픈 특유의 조밀한 간격 */
            width: 100%;
            margin: 0 auto;
        }

        /* [수정] 좌우 곡 선택 상자를 엔하이픈과 똑같은 슬림한 직사각형으로 변경 */
        .sort-box {
            width: 180px;
            height: 220px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px; /* 모바일에서도 삐져나가지 않는 최적의 글씨 크기 */
            font-weight: normal; /* 엔하이픈의 깔끔한 기본 서체 느낌 적용 */
            color: #000000;
            cursor: pointer;
            padding: 15px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        /* 가운데 버튼 묶음 틀 */
        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* [수정] 둘 다 좋다, 모르겠다 버튼 크기를 좌우 박스 높이에 컴팩트하게 맞춤 */
        .option-btn {
            width: 130px;
            height: 106px; /* 두 개 합쳐서 좌우 박스 높이랑 딱 맞아떨어지게 설정 */
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        /* 결과 화면 디자인 */
        #resultArea {
            display: none;
            margin-top: 30px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 10px;
            font-size: 15px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        Battle No. 1<br>0% sorted.
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(0)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(1)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(2)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(3)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <h2>소터 결과 순위</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 플레이브 노래 목록 데이터
    const songs = [
        "Wait For You", "픽셀월드 (Pixel World)", "왜요 왜요 왜?", 
        "여섯 번째 여름", "I Just Love Ya", "Dear. PLLI", 
        "Our Movie", "From", "Merry PLLImas", "Way 4 Luv", 
        "WATCH ME WOO!", "Virtual Idol", "From (2024 Ver.)"
    ];

    // 소터 정밀 병합 알고리즘 구현 데이터
    let lstMember = [];
    let parent = [];
    let equal = [];
    let rec = [];
    let cmp1, cmp2;
    let head1, head2;
    let nsort;
    let numQuestion;
    let totalSize = 0;
    let finishFlag = 0;

    function initSorter() {
        nsort = 0;
        lstMember[nsort] = [];
        for (let i = 0; i < songs.length; i++) {
            lstMember[nsort][i] = i;
        }
        parent[nsort] = -1;
        equal[nsort] = -1;
        nsort++;

        let size = 1;
        while (size < songs.length) {
            let i = 0;
            while (i + size < songs.length) {
                let mid = i + size;
                let end = i + size * 2;
                if (end > songs.length) end = songs.length;

                lstMember[nsort] = [];
                let idx = 0;
                for (let j = i; j < mid; j++) lstMember[nsort][idx++] = lstMember[nsort - 1][j];
                parent[nsort] = nsort + 1;
                equal[nsort] = -1;
                nsort++;

                lstMember[nsort] = [];
                idx = 0;
                for (let j = mid; j < end; j++) lstMember[nsort][idx++] = lstMember[nsort - 1][j];
                parent[nsort] = nsort - 1;
                equal[nsort] = -1;
                nsort++;

                i += size * 2;
            }
            size *= 2;
        }

        rec = [];
        for (let i = 0; i < songs.length; i++) rec[i] = 0;

        cmp1 = nsort - 2;
        cmp2 = nsort - 1;
        head1 = 0;
        head2 = 0;
        numQuestion = 1;

        totalSize = 0;
        let tempSize = 1;
        while(tempSize < songs.length) {
            totalSize += songs.length;
            tempSize *= 2;
        }

        showBattle();
    }

    function showBattle() {
        if (finishFlag) return;

        let leftIdx = lstMember[cmp1][head1];
        let rightIdx = lstMember[cmp2][head2];

        document.getElementById("leftTitle").textContent = songs[leftIdx];
        document.getElementById("rightTitle").textContent = songs[rightIdx];

        let progress = Math.floor((numQuestion / totalSize) * 100);
        if (progress > 99) progress = 99;

        document.getElementById("battleInfo").innerHTML = `Battle No. ${numQuestion}<br>${progress}% sorted.`;
    }

    function sortSelect(flag) {
        if (finishFlag) return;

        let leftIdx = lstMember[cmp1][head1];
        let rightIdx = lstMember[cmp2][head2];

        if (flag === 0) {
            rec[leftIdx] = cmp1;
            head1++;
        } else if (flag === 3) {
            rec[rightIdx] = cmp2;
            head2++;
        } else if (flag === 1 || flag === 2) {
            rec[leftIdx] = cmp1;
            rec[rightIdx] = cmp2;
            head1++;
            head2++;
        }

        numQuestion++;

        if (head1 >= lstMember[cmp1].length || head2 >= lstMember[cmp2].length) {
            while (head1 < lstMember[cmp1].length) {
                rec[lstMember[cmp1][head1]] = cmp1;
                head1++;
            }
            while (head2 < lstMember[cmp2].length) {
                rec[lstMember[cmp2][head2]] = cmp2;
                head2++;
            }

            let p = parent[cmp1];
            if (p !== -1) {
                cmp1 = p - 2;
                cmp2 = p - 1;
                head1 = 0;
                head2 = 0;
            } else {
                finishFlag = 1;
                showResult();
                return;
            }
        }

        if (cmp1 < 0 || cmp2 < 0) {
            finishFlag = 1;
            showResult();
        } else {
            showBattle();
        }
    }

    function showResult() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML =
