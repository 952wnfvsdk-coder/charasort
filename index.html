<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        .progress-info {
            font-size: 11px;
            color: #000000;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        .sort-box {
            width: 140px;
            height: 160px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            width: 100px;
            height: 77px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            padding: 8px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        #resultArea {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        로딩 중...
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

    <script>
    // 플레이브 노래 목록 (33곡이든 몇 곡이든 여기에 쭉 넣으시면 됩니다)
    const songs = [
         "기다릴게", 
        "Pixel World", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "우리 영화", 
        "From", 
        "Merry PLLImas", 
        "달랐을까", 
        "Watch Me Woo!",
        "버추얼 아이돌",
        "Pump Up The Volume!",
        "WAY 4 LUV",
        "멈추지 않아",
        "Chroma Drift",
        "Dash",
    "RIZZ",
    "Island",
    "12:32 (A to T)",
    "Hide and Seek",
    "RIZZ (Japanese ver.)",
    "Chroma Drift (Japanese ver.)",
    "숨바꼭질",
    "BBUU!",
    "봉숭아",
    "BBUU! (Christmas ver.)",
    "이 밤을 빌려 말해요",
    "흥흥흥 (feat. SOLE)",
    "꽃송이들의 퍼레이드",
    "Born Savage",
    "Lunar Hearts",
    "그런 것 같아"
        // 추가하신 나머지 곡들이 이 아래로 쭉 들어가 있으면 됩니다!
    ];

    // 엔하이픈 소터와 동일한 고정식 정렬 알고리즘
    let leftIndex = 0;
    let rightIndex = 1;
    let battleNo = 1;
    let sortedCount = 0;
    let totalBattles = 0;
    let scoreMap = {};

    function initSorter() {
        // 새로고침해도 랜덤으로 섞지 않고, 무조건 songs 배열에 적힌 첫 번째 순서대로 시작합니다.
        songs.forEach(song => {
            scoreMap[song] = 0;
        });
        
        // 33곡 기준 약 120~130판 안팎의 정밀한 총 배틀 수가 계산됩니다.
        totalBattles = Math.ceil(songs.length * Math.log2(songs.length)) * 0.75;
        leftIndex = 0;
        rightIndex = 1;
        showBattle();
    }

    function showBattle() {
        document.getElementById("leftTitle").textContent = songs[leftIndex];
        document.getElementById("rightTitle").textContent = songs[rightIndex];

        // 진행률 계산
        let progress = Math.floor((sortedCount / totalBattles) * 100);
        if (progress > 99) progress = 99;
        if (progress < 0) progress = 0;

        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        let leftSong = songs[leftIndex];
        let rightSong = songs[rightIndex];

        if (choice === 1) {
            scoreMap[leftSong] += 2;
            scoreMap[rightSong] -= 1;
        } else if (choice === 2) {
            scoreMap[rightSong] += 2;
            scoreMap[leftSong] -= 1;
        } else if (choice === 0 || choice === -1) {
            scoreMap[leftSong] += 1;
            scoreMap[rightSong] += 1;
        }

        battleNo++;
        sortedCount++;
        rightIndex++;

        // 오른쪽 곡이 끝까지 돌면 왼쪽 곡을 다음 곡으로 넘깁니다 (고정 순서 규칙)
        if (rightIndex >= songs.length) {
            leftIndex++;
            rightIndex = leftIndex + 1;
        }

        // 모든 비교가 끝나면 결과 출력
        if (leftIndex >= songs.length - 1 || battleNo > totalBattles * 1.5) {
            finishSorter();
        } else {
            showBattle();
        }
    }

    function finishSorter() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        let rankedSongs = songs.map(song => {
            return { name: song, score: scoreMap[song] };
        }).sort((a, b) => b.score - a.score);

        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };

</script>
</body>
</html>
