<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        /* 요청하신 상단 고정 미니멀 레이아웃 */
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        .progress-info {
            font-size: 11px;
            color: #000000;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        /* 가로 140px, 세로 160px 컴팩트 박스 크기 유지 */
        .sort-box {
            width: 140px;
            height: 160px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            width: 100px;
            height: 77px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            padding: 8px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        #resultArea {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        Battle No. 1<br>0% sorted.
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <h2>소터 결과 순위</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 플레이브 공식 전곡 리스트
    const songs = [
        "Wait For You", 
        "픽셀월드 (Pixel World)", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "Our Movie", 
        "From", 
        "Merry PLLImas", 
        "Way 4 Luv", 
        "WATCH ME WOO!", 
        "Virtual Idol", 
        "From (2024 Ver.)",
        "Pump Up The Volume!",
        "RIDGE (틈)"
    ];

    let battleNo = 1;
    let scoreMap = {};
    let totalBattles = 0;
    let battlePairs = [];
    let currentPairIndex = 0;

    // 모든 가능한 대결 쌍을 만들고 무작위로 섞는 알고리즘
    function initSorter() {
        songs.forEach(song => { scoreMap[song] = 0; });

        // 1. 모든 곡의 대결 조합 생성 (예: 15곡이면 총 105개의 대결)
        for (let i = 0; i < songs.length; i++) {
            for (let j = i + 1; j < songs.length; j++) {
                // 왼쪽/오른쪽도 랜덤하게 배치하기 위해 50% 확률로 순서 섞음
                if (Math.random() > 0.5) {
                    battlePairs.push([i, j]);
                } else {
                    battlePairs.push([j, i]);
                }
            }
        }

        // 2. 생성된 대결 묶음 전체를 완전 무작위로 shuffle (한쪽만 안 바뀌는 현상 100% 차단)
        for (let i = battlePairs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [battlePairs[i], battlePairs[j]] = [battlePairs[j], battlePairs[i]];
        }

        totalBattles = battlePairs.length;
        showBattle();
    }

    function showBattle() {
        if (currentPairIndex >= totalBattles) {
            finishSorter();
            return;
        }

        let pair = battlePairs[currentPairIndex];
        document.getElementById("leftTitle").textContent = songs[pair[0]];
        document.getElementById("rightTitle").textContent = songs[pair[1]];

        let progress = Math.floor((currentPairIndex / totalBattles) * 100);
        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        if (currentPairIndex >= totalBattles) return;

        let pair = battlePairs[currentPairIndex];
        let leftSong = songs[pair[0]];
        let rightSong = songs[pair[1]];

        if (choice === 1) {
            scoreMap[leftSong] += 2;
            scoreMap[rightSong] -= 1;
        } else if (choice === 2) {
            scoreMap[rightSong] += 2;
            scoreMap[leftSong] -= 1;
        } else {
            scoreMap[leftSong] += 1;
            scoreMap[rightSong] += 1;
        }

        battleNo++;
        currentPairIndex++;
        showBattle();
    }

    function finishSorter() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        // 점수 기준으로 최종 순위 생성
        let rankedSongs = songs.map(song => {
            return { name: song, score: scoreMap[song] };
        }).sort((a, b) => b.score - a.score);

        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };
</script>
</body>
</html>
