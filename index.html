<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Malgun Gothic", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        .progress-info {
            font-size: 11px;
            color: #000000;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        .sort-box {
            width: 140px;
            height: 160px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            width: 100px;
            height: 77px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            padding: 8px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        #resultArea {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        로딩 중...
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

    <script>
   

    // 플레이브 노래 목록 (33곡이 여기에 그대로 유지되어 있으면 됩니다)
    const songs = [
        "기다릴게", 
        "Pixel World", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "우리 영화", 
        "From", 
        "Merry PLLImas", 
        "달랐을까", 
        "Watch Me Woo!",
        "버추얼 아이돌",
        "Pump Up The Volume!",
        "WAY 4 LUV",
        "멈추지 않아",
        "Chroma Drift",
        "Dash",
    "RIZZ",
    "Island",
    "12:32 (A to T)",
    "Hide and Seek",
    "RIZZ (Japanese ver.)",
    "Chroma Drift (Japanese ver.)",
    "숨바꼭질",
    "BBUU!",
    "봉숭아",
    "BBUU! (Christmas ver.)",
    "이 밤을 빌려 말해요",
    "흥흥흥 (feat. SOLE)",
    "꽃송이들의 퍼레이드",
    "Born Savage",
    "Lunar Hearts",
    "그런 것 같아"
        // 추가하신 나머지 곡들이 이 아래로 쭉 들어있으면 됩니다!
    ];

    // 엔하이픈 소터 표준 병합 정렬 알고리즘
    let battleNo = 1;
    let scoreMap = {};
    
    let mainList = [];
    let subList = [];
    let headLeft = 0;
    let headRight = 0;
    let mid = null;
    let pairList = [];
    let finishFlag = false;

    function initSorter() {
        songs.forEach(song => { scoreMap[song] = 0; });
        
        // 새로고침해도 늘 songs 배열 순서대로 정직하게 시작하도록 고정합니다.
        mainList = songs.map((song, idx) => [idx]);
        subList = [];
        
        prepareNextMerge();
    }

    function prepareNextMerge() {
        if (mainList.length <= 1) {
            finishSorter();
            return;
        }
        subList = [];
        executeMergeStep();
    }

    function executeMergeStep() {
        if (mainList.length >= 2) {
            let leftArr = mainList.shift();
            let rightArr = mainList.shift();
            pairList = [leftArr, rightArr];
            headLeft = 0;
            headRight = 0;
            showBattle();
        } else if (mainList.length === 1) {
            subList.push(mainList.shift());
            if (mainList.length === 0) {
                mainList = subList;
                prepareNextMerge();
            }
        } else {
            mainList = subList;
            prepareNextMerge();
        }
    }

    function showBattle() {
        if (finishFlag) return;
        
        let leftSongIdx = pairList[0][headLeft];
        let rightSongIdx = pairList[1][headRight];

        document.getElementById("leftTitle").textContent = songs[leftSongIdx];
        document.getElementById("rightTitle").textContent = songs[rightSongIdx];

        // 33곡 기준 약 120~130판 내외로 끝나는 진행률 계산
        let totalEstimated = Math.ceil(songs.length * Math.log2(songs.length)) * 0.74;
        let progress = Math.min(99, Math.floor((battleNo / totalEstimated) * 100));
        if (progress < 0) progress = 0;

        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        if (finishFlag) return;

        let leftArr = pairList[0];
        let rightArr = pairList[1];
        
        if (!mid) mid = [];

        if (choice === 1) {
            scoreMap[songs[leftArr[headLeft]]] += 2;
            mid.push(leftArr[headLeft]);
            headLeft++;
        } else if (choice === 2) {
            scoreMap[songs[rightArr[headRight]]] += 2;
            mid.push(rightArr[headRight]);
            headRight++;
        } else {
            scoreMap[songs[leftArr[headLeft]]] += 1;
            scoreMap[songs[rightArr[headRight]]] += 1;
            mid.push(leftArr[headLeft]);
            mid.push(rightArr[headRight]);
            headLeft++;
            headRight++;
        }

        battleNo++;

        if (headLeft >= leftArr.length || headRight >= rightArr.length) {
            while (headLeft < leftArr.length) {
                mid.push(leftArr[headLeft]);
                headLeft++;
            }
            while (headRight < rightArr.length) {
                mid.push(rightArr[headRight]);
                headRight++;
            }
            
            subList.push(mid);
            mid = null;

            if (mainList.length === 0) {
                mainList = subList;
                if (mainList.length <= 1) {
                    finishSorter();
                    return;
                }
                subList = [];
            }
            executeMergeStep();
        } else {
            showBattle();
        }
    }

    function finishSorter() {
        finishFlag = true;
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        let finalOrder = mainList[0] || [];
        let rankedSongs = finalOrder.map(idx => {
            return { name: songs[idx], score: scoreMap[songs[idx]] };
        });

        rankedSongs.sort((a, b) => b.score - a.score);

        songs.forEach(song => {
            if (!rankedSongs.some(item => item.name === song)) {
                rankedSongs.push({ name: song, score: scoreMap[song] });
            }
        });

        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };
</script>
</body>
</html>
