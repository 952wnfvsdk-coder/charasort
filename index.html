<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        .progress-info {
            font-size: 11px;
            color: #000000;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        .sort-box {
            width: 140px;
            height: 160px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            width: 100px;
            height: 77px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            padding: 8px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        #resultArea {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        로딩 중...
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

    <script>
   
   <script>
   
    // 플레이브 노래 목록 (33곡이든 몇 곡이든 여기에 쭉 유지하시면 됩니다)
    const songs = [
       "기다릴게", 
        "Pixel World", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "우리 영화", 
        "From", 
        "Merry PLLImas", 
        "달랐을까", 
        "Watch Me Woo!",
        "버추얼 아이돌",
        "Pump Up The Volume!",
        "WAY 4 LUV",
        "멈추지 않아",
        "Chroma Drift",
        "Dash",
    "RIZZ",
    "Island",
    "12:32 (A to T)",
    "Hide and Seek",
    "RIZZ (Japanese ver.)",
    "Chroma Drift (Japanese ver.)",
    "숨바꼭질",
    "BBUU!",
    "봉숭아",
    "BBUU! (Christmas ver.)",
    "이 밤을 빌려 말해요",
    "흥흥흥 (feat. SOLE)",
    "꽃송이들의 퍼레이드",
    "Born Savage",
    "Lunar Hearts",
    "그런 것 같아"
        // 추가하신 나머지 곡들을 이 아래에 그대로 두시면 됩니다!
    ];

    let battleNo = 1;
    let scoreMap = {};
    let totalBattles = 0;
    let battlePairs = [];
    let currentPairIndex = 0;

    function initSorter() {
        songs.forEach(song => { scoreMap[song] = 0; });

        let tempPairs = [];
        // 1. 모든 가능한 대결 조합 생성
        for (let i = 0; i < songs.length; i++) {
            for (let j = i + 1; j < songs.length; j++) {
                tempPairs.push([i, j]);
            }
        }

        // 2. [핵심] 징검다리식 고정 분산 알고리즘 (새로고침해도 순서 100% 동일)
        // 대진표가 연속되지 않도록 일정한 수학적 간격(소수 활용)으로 건너뛰며 재배치합니다.
        // 이 방식은 연산이 필요 없어 무한 루프가 절대 발생하지 않으며, 양쪽이 무조건 동시에 바뀝니다.
        let len = tempPairs.length;
        let step = 37; // 대진을 일정하게 분산시키기 위한 고정 프라임 스텝
        if (step >= len) step = 1;

        let mark = new Array(len).fill(false);
        let idx = 0;

        for (let i = 0; i < len; i++) {
            while (mark[idx]) {
                idx = (idx + 1) % len;
            }
            battlePairs.push(tempPairs[idx]);
            mark[idx] = true;
            idx = (idx + step) % len;
        }

        totalBattles = battlePairs.length;
        showBattle();
    }

    function showBattle() {
        if (currentPairIndex >= totalBattles) {
            finishSorter();
            return;
        }

        let pair = battlePairs[currentPairIndex];
        document.getElementById("leftTitle").textContent = songs[pair[0]];
        document.getElementById("rightTitle").textContent = songs[pair[1]];

        // 진행률 표시
        let progress = Math.floor((currentPairIndex / totalBattles) * 100);
        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        if (currentPairIndex >= totalBattles) return;

        let pair = battlePairs[currentPairIndex];
        let leftSong = songs[pair[0]];
        let rightSong = songs[pair[1]];

        if (choice === 1) {
            scoreMap[leftSong] += 2;
            scoreMap[rightSong] -= 1;
        } else if (choice === 2) {
            scoreMap[rightSong] += 2;
            scoreMap[leftSong] -= 1;
        } else {
            scoreMap[leftSong] += 1;
            scoreMap[rightSong] += 1;
        }

        battleNo++;
        currentPairIndex++;
        showBattle();
    }

    function finishSorter() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        let rankedSongs = songs.map(song => {
            return { name: song, score: scoreMap[song] };
        }).sort((a, b) => b.score - a.score);

        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };
</script>
</body>
</html>
