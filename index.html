<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>

  <link rel="stylesheet" type="text/css" href="src/css/reset.css">
  <link rel="stylesheet" type="text/css" href="src/css/styles.css">

  <script src="src/js/data.js"></script>
  <script src="src/js/html2canvas.min.js"></script>
  <script src="src/js/lz-string.min.js"></script>
  <script src="src/js/seedrandom.min.js"></script>
  <script src="src/js/main.js"></script>

  <style>
    /* 1. 하단의 지저분한 가이드 텍스트 숨김 */
    .info, .image.selector { 
      display: none !important; 
    }

    /* 2. 전체 레이아웃 가운데 정렬 및 스크롤 방지 */
    .container {
      max-width: 900px !important;
      margin: 40px auto !important;
      padding: 0 20px !important;
      text-align: center !important;
    }

    /* 3. 자바스크립트 인식을 방해하던 요소 정렬을 원본 뼈대 그대로 유지하면서 배치 조절 */
    .sorter {
      display: flex !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 15px !important;
      position: relative !important;
      width: 100% !important;
      margin: 0 auto !important;
    }

    /* 4. 원본 자바스크립트가 무조건 클릭을 감지해야 하는 '이미지 태그'를 투명하게 만들고 
       좌우 상자 크기만큼 꽉 채워서, 마우스를 대고 누르면 무조건 클릭이 먹히도록 처리 */
    .sort.image {
      display: block !important;
      width: 280px !important;
      height: 280px !important;
      border: 1px solid #000 !important;
      background: #ffffff !important;
      opacity: 0 !important; /* 투명하게 만들어 엑스박스 안 보이게 처리 */
      cursor: pointer !important;
      z-index: 10 !important;
    }

    /* 5. 노래 제목이 뜨는 텍스트 박스 디자인 (투명한 이미지 뒤에 예쁘게 배치) */
    .sort.text {
      width: 280px !important;
      height: 280px !important;
      border: 1px solid #000 !important;
      background: #ffffff !important;
      position: absolute !important;
      top: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 22px !important;
      font-weight: bold !important;
      color: #000 !important;
      z-index: 5 !important;
      pointer-events: none !important; /* 마우스 클릭이 뒤에 있는 이미지에 닿도록 통과시킴 */
    }

    /* 왼쪽과 오른쪽 텍스트 박스 위치 강제 고정 */
    .left.sort.text { left: 0 !important; }
    .right.sort.text { right: 0 !important; }

    /* 6. 메인 시작 버튼 및 내부 제어 버튼들을 부드럽게 한가운데로 정렬 */
    .button {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-width: 200px !important;
      min-height: 60px !important;
      border: 1px solid #000 !important;
      background: #ffffff !important;
      cursor: pointer !important;
      font-size: 16px !important;
      font-weight: bold !important;
      padding: 10px 20px !important;
      margin: 5px !important;
      z-index: 20 !important;
    }

    /* 시작하기 버튼은 특별히 더 큼직하게 정중앙 배치 */
    .starting.start.button {
      min-width: 280px !important;
      min-height: 100px !important;
      font-size: 18px !important;
    }
  </style>
</head>

<body>
<div class="container">

    <div class="progress">
        <span class="progressbattle"></span>
        <div class="progressbar">
            <div class="progressfill"><span class="progresstext"></span></div>
        </div>
    </div>

    <div class="sorter">
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="left sort image">

        <div class="starting start button">플레이브 곡 소터<br><br>클릭하여 시작하기<br>(Click to Start)</div>
        <div class="starting load button">이어하기 <span></span></div>

        <div class="loading button"><div></div><span>로딩 중...</span></div>

        <div class="sorting tie button">무승부 (Tie)</div>
        <div class="sorting undo button">되돌리기 (Undo)</div>
        <div class="sorting save button">진행 상황 저장</div>

        <div class="finished save button">결과 URL 생성</div>
        <div class="finished getimg button">이미지 저장</div>
        <div class="finished list button">텍스트 리스트 생성</div>

        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="right sort image">

        <div class="left sort text"><p></p></div>
        <div class="right sort text"><p></p></div>
    </div>

    <div class="options"></div>
    <div class="time taken"></div>
    <div class="results"></div>

</div>
</body>

</html>
