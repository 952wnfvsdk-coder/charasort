<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        /* 요청하신 상단 고정 미니멀 레이아웃 */
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        .progress-info {
            font-size: 11px;
            color: #000000;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        /* 가로 140px, 세로 160px 컴팩트 박스 크기 유지 */
        .sort-box {
            width: 140px;
            height: 160px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            width: 100px;
            height: 77px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            padding: 8px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        #resultArea {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        Battle No. 1<br>0% sorted.
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <h2>소터 결과 순위</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 플레이브 공식 전곡 리스트 (노래 추가 시 기존 규칙대로 따옴표와 쉼표를 활용해 주세요)
    const songs = [
        "Wait For You", 
        "픽셀월드 (Pixel World)", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "Our Movie", 
        "From", 
        "Merry PLLImas", 
        "Way 4 Luv", 
        "WATCH ME WOO!", 
        "Virtual Idol", 
        "From (2024 Ver.)",
        "Pump Up The Volume!",
        "RIDGE (틈)"
    ];

    // 병합 정렬(Merge Sort) 기반의 실시간 양쪽 교체 소터 알고리즘
    let leftIndex = 0;
    let rightIndex = 0;
    let battleNo = 1;
    let scoreMap = {};
    
    let mainList = [];
    let subList = [];
    let headLeft = 0;
    let headRight = 0;
    let mid = 0;
    let end = 0;
    let pairList = [];
    let finishFlag = false;

    function initSorter() {
        songs.forEach(song => { scoreMap[song] = 0; });
        
        // 초기 정렬 큐 배열 생성
        mainList = songs.map((song, idx) => [idx]);
        subList = [];
        
        prepareNextMerge();
    }

    function prepareNextMerge() {
        if (mainList.length <= 1) {
            finishSorter();
            return;
        }

        subList = [];
        executeMergeStep();
    }

    function executeMergeStep() {
        if (mainList.length >= 2) {
            let leftArr = mainList.shift();
            let rightArr = mainList.shift();
            pairList = [leftArr, rightArr];
            headLeft = 0;
            headRight = 0;
            showBattle();
        } else if (mainList.length === 1) {
            subList.push(mainList.shift());
            if (mainList.length === 0) {
                mainList = subList;
                prepareNextMerge();
            }
        } else {
            mainList = subList;
            prepareNextMerge();
        }
    }

    function showBattle() {
        if (finishFlag) return;
        
        let leftSongIdx = pairList[0][headLeft];
        let rightSongIdx = pairList[1][headRight];

        document.getElementById("leftTitle").textContent = songs[leftSongIdx];
        document.getElementById("rightTitle").textContent = songs[rightSongIdx];

        // 대략적인 진행률 계산 계산식
        let totalEstimated = Math.ceil(songs.length * Math.log2(songs.length));
        let progress = Math.min(99, Math.floor((battleNo / totalEstimated) * 100));
        if (progress < 0) progress = 0;

        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        if (finishFlag) return;

        let leftArr = pairList[0];
        let rightArr = pairList[1];
        
        if (!mid) mid = [];

        // 선택에 따른 가중치 부여 및 리스트 병합 처리
        if (choice === 1) {
            scoreMap[songs[leftArr[headLeft]]] += 2;
            mid.push(leftArr[headLeft]);
            headLeft++;
        } else if (choice === 2) {
            scoreMap[songs[rightArr[headRight]]] += 2;
            mid.push(rightArr[headRight]);
            headRight++;
        } else {
            // 둘다 좋다 / 모르겠다 선택 시 둘 다 점수 부여 후 순서대로 삽입
            scoreMap[songs[leftArr[headLeft]]] += 1;
            scoreMap[songs[rightArr[headRight]]] += 1;
            mid.push(leftArr[headLeft]);
            mid.push(rightArr[headRight]);
            headLeft++;
            headRight++;
        }

        battleNo++;

        // 한쪽 배열이 끝나면 남은 배열을 모두 붙임
        if (headLeft >= leftArr.length || headRight >= rightArr.length) {
            while (headLeft < leftArr.length) {
                mid.push(leftArr[headLeft]);
                headLeft++;
            }
            while (headRight < rightArr.length) {
                mid.push(rightArr[headRight]);
                headRight++;
            }
            
            subList.push(mid);
            mid = null;

            if (mainList.length === 0) {
                mainList = subList;
                if (mainList.length <= 1) {
                    finishSorter();
                    return;
                }
                subList = [];
            }
            executeMergeStep();
        } else {
            showBattle();
        }
    }

    function finishSorter() {
        finishFlag = true;
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        // 최종 병합 순서 및 가중치 점수를 조합하여 정렬
        let finalOrder = mainList[0] || [];
        let rankedSongs = finalOrder.map(idx => {
            return { name: songs[idx], score: scoreMap[songs[idx]] };
        });

        // 만약 가중치가 동점일 경우를 대비해 스코어 역순 정렬 보완
        rankedSongs.sort((a, b) => b.score - a.score);

        // 예외 처리: 혹시 누락된 곡이 있다면 하단에 자동 추가
        songs.forEach(song => {
            if (!rankedSongs.some(item => item.name === song)) {
                rankedSongs.push({ name: song, score: scoreMap[song] });
            }
        });

        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };
</script>
</body>
</html>
