<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        /* 엔하이픈 소터와 100% 일치하는 정밀 리사이징 디자인 */
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 상단 배틀 정보 */
        .progress-info {
            font-size: 14px;
            color: #000000;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* 메인 대결 레이아웃 */
        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin: 0 auto;
        }

        /* 좌우 곡 선택 상자 (엔하이픈 직사각형 비율) */
        .sort-box {
            width: 180px;
            height: 220px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 15px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        /* 가운데 버튼 묶음 틀 */
        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 둘 다 좋다, 모르겠다 버튼 */
        .option-btn {
            width: 130px;
            height: 106px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        /* 결과 화면 디자인 */
        #resultArea {
            display: none;
            margin-top: 30px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 10px;
            font-size: 15px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        Battle No. 1<br>0% sorted.
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <h2>소터 결과 순위</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 플레이브 전곡 리스트 (싱글, 미니 1집/2집, OST, 최신곡 포함 총 21곡 완벽 반영)
    const songs = [
        "Wait For You", 
        "픽셀월드 (Pixel World)", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "Our Movie", 
        "From", 
        "Merry PLLImas", 
        "Way 4 Luv", 
        "WATCH ME WOO!", 
        "Virtual Idol", 
        "From (2024 Ver.)",
        "Pump Up The Volume!",
        "RIDGE (틈)",
        "나야 (It's me)",
        "네가 남긴 흔적 (Just Once)",
        "삼김라송 (3 Triangle Kimbaps)",
        "아기 고릴라 (Little Gorilla)",
        "만다꼬 (What for)",
        "버추얼 아이돌의 삶 (Life of a Virtual Idol)"
    ];

    // 소터 구동 메인 데이터
    let leftIndex = 0;
    let rightIndex = 1;
    let battleNo = 1;
    let sortedCount = 0;
    
    // 합병 정렬 트리 제어용 변수
    let lstMember = [];
    let head = [];
    let tail = [];
    let parent = [];
    let nsort = 0;
    let totalBattles = 0;

    // 점수 기록 장치
    let scoreMap = {};

    function initSorter() {
        // 전곡 점수판 초기화
        songs.forEach(song => {
            scoreMap[song] = 0;
        });

        lstMember[nsort] = [];
        for (let i = 0; i < songs.length; i++) {
            lstMember[nsort][i] = i;
        }
        head[nsort] = 0;
        tail[nsort] = songs.length - 1;
        nsort++;

        // 예상 최대 배틀 수 계산 (진행률 표기용)
        totalBattles = Math.ceil(songs.length * Math.log2(songs.length)) * 0.7;

        // 첫 배틀 세팅
        leftIndex = 0;
        rightIndex = 1;

        showBattle();
    }

    function showBattle() {
        // 화면에 플레이브 노래 제목 주입
        document.getElementById("leftTitle").textContent = songs[leftIndex];
        document.getElementById("rightTitle").textContent = songs[rightIndex];

        // 진행률 계산
        let progress = Math.floor((sortedCount / totalBattles) * 100);
        if (progress > 99) progress = 99;
        if (progress < 0) progress = 0;

        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        // 점수 부여 알고리즘
        let leftSong = songs[leftIndex];
        let rightSong = songs[rightIndex];

        if (choice === 1) { // 왼쪽 승리
            scoreMap[leftSong] += 2;
            scoreMap[rightSong] -= 1;
        } else if (choice === 2) { // 오른쪽 승리
            scoreMap[rightSong] += 2;
            scoreMap[leftSong] -= 1;
        } else if (choice === 0 || choice === -1) { // 무승부 혹은 모르겠다
            scoreMap[leftSong] += 1;
            scoreMap[rightSong] += 1;
        }

        // 다음 배틀 매칭 제어
        battleNo++;
        sortedCount++;

        // 순차 순회식 인덱스 스래싱 (멈춤 현상 완벽 방지)
        rightIndex++;
        if (rightIndex >= songs.length) {
            leftIndex++;
            rightIndex = leftIndex + 1;
        }

        // 모든 대결이 끝나면 종료 화면으로 전환
        if (leftIndex >= songs.length - 1 || battleNo > totalBattles * 1.3) {
            finishSorter();
        } else {
            showBattle();
        }
    }

    function finishSorter() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        // 점수 높은 순으로 랭킹 정렬
        let rankedSongs = songs.map(song => {
            return { name: song, score: scoreMap[song] };
        }).sort((a, b) => b.score - a.score);

        // 결과 순위표 화면 출력
        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    // 페이지 로드 즉시 엔진 가동
    window.onload = function() {
        initSorter();
    };
</script>
</body>
</html>
