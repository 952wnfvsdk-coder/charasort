<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="og:site_name" content="플레이브 곡 소터">
  <meta name="og:description" content="플레이브의 곡들을 정렬하고 나만의 순위를 매겨보세요.">
  <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>

  <link rel="stylesheet" type="text/css" href="src/css/reset.css">
  <link rel="stylesheet" type="text/css" href="src/css/styles.css">

  <script src="src/js/data.js"></script>
  <script src="src/js/html2canvas.min.js"></script>
  <script src="src/js/lz-string.min.js"></script>
  <script src="src/js/seedrandom.min.js"></script>
  <script src="src/js/main.js"></script>

  <style>
    /* 그림이랑 아래 긴 설명글 싹 지우는 마법의 코드 */
    .sort.image, .info, br {
      display: none !important;
    }
    /* 모바일 맞춤 크기 조절 */
    .container {
      max-width: 100% !important;
      padding: 10px;
    }
    .sorter {
      margin: 20px auto !important;
    }
  </style>
</head>

<body>
<div class="container">

    <div class="progress">
        <span class="progressbattle"></span>
        <div class="progressbar">
            <div class="progressfill"><span class="progresstext"></span></div>
        </div>
    </div>

    <div class="sorter">
        <img src="src/assets/defaultL.jpg" class="left sort image">

        <div class="starting start button" style="cursor: pointer;">플레이브 곡 소터<br><br>터치하여 시작하기</div>
        <div class="starting load button" style="cursor: pointer;">이어하기 <span></span></div>

        <div class="loading button"><div></div><span>로딩 중...</span></div>

        <div class="sorting tie button" style="cursor: pointer;">무승부 (Tie)</div>
        <div class="sorting undo button" style="cursor: pointer;">되돌리기 (Undo)</div>
        <div class="sorting save button" style="cursor: pointer;">진행 상황 저장</div>

        <div class="finished save button" style="cursor: pointer;">결과 URL 생성</div>
        <div class="finished getimg button" style="cursor: pointer;">이미지 저장</div>
        <div class="finished list button" style="cursor: pointer;">텍스트 리스트 생성</div>

        <img src="src/assets/defaultR.jpg" class="right sort image">

        <div class="left sort text" style="cursor: pointer;"><p></p></div>
        <div class="right sort text" style="cursor: pointer;"><p></p></div>
    </div>

    <div class="options"></div>
    <div class="image selector" style="display:none;">Display Images on Result: </div>
    <div class="time taken"></div>
    <div class="results"></div>

</div>
</body>

</html>
