<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="og:site_name" content="플레이브 곡 소터">
  <meta name="og:description" content="플레이브의 곡들을 정렬하고 나만의 순위를 매겨보세요.">
  <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>

  <link rel="stylesheet" type="text/css" href="src/css/reset.css">
  <link rel="stylesheet" type="text/css" href="src/css/styles.css">

  <script src="src/js/data.js"></script>
  <script src="src/js/html2canvas.min.js"></script>
  <script src="src/js/lz-string.min.js"></script>
  <script src="src/js/seedrandom.min.js"></script>
  <script src="src/js/main.js"></script>

  <style>
    /* 하단 쓸데없는 긴 가이드 글씨만 깔끔하게 제거 */
    .info {
      display: none !important;
    }

    /* PC와 모바일 모두에서 화면이 가운데에 예쁘게 정렬되도록 조정 */
    .container {
      max-width: 800px !important;
      margin: 0 auto !important;
      padding: 20px 10px;
    }

    /* 노래를 선택하는 좌우 거대한 구역 스타일 수정 */
    .left.sort, .right.sort {
      border: 1px solid #000 !important;
      background: #ffffff !important;
      cursor: pointer !important;
      padding: 20px !important;
      min-height: 250px !important;
    }

    /* 클릭을 먹통으로 만들던 범인(이미지 태그)을 투명하게 만들어 숨기면서도, 
       클릭 판정 영역은 넓은 사각형 전체에 그대로 살아있게 만드는 마법의 설정입니다 */
    .sort.image {
      opacity: 0 !important;
      width: 100% !important;
      height: 150px !important;
      position: absolute !important;
      top: 0;
      left: 0;
      cursor: pointer !important;
    }

    /* 노래 제목 텍스트 위치 조절 및 클릭 허용 */
    .sort.text {
      width: 100% !important;
      height: auto !important;
      border: none !important;
      margin-top: 160px !important;
      font-size: 20px !important;
      font-weight: bold !important;
      color: #000 !important;
      pointer-events: none !important; /* 글자 뒤에 숨은 그림 영역이 클릭을 먹도록 처리 */
    }

    /* 시작 버튼 및 기능 버튼들 마우스 포인터 손가락 모양으로 변경 */
    .button {
      cursor: pointer !important;
    }
  </style>
</head>

<body>
<div class="container">

    <div class="progress">
        <span class="progressbattle"></span>
        <div class="progressbar">
            <div class="progressfill"><span class="progresstext"></span></div>
        </div>
    </div>

    <div class="sorter">
        <div class="left sort" style="position: relative;">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="left sort image">
            <div class="left sort text"><p></p></div>
        </div>

        <div class="starting start button">플레이브 곡 소터<br><br>클릭하여 시작하기 (Click to Start)</div>
        <div class="starting load button">이어하기 <span></span></div>

        <div class="loading button"><div></div><span>로딩 중...</span></div>

        <div class="sorting tie button">무승부 (Tie)</div>
        <div class="sorting undo button">되돌리기 (Undo)</div>
        <div class="sorting save button">진행 상황 저장</div>

        <div class="finished save button">결과 URL 생성</div>
        <div class="finished getimg button">이미지 저장</div>
        <div class="finished list button">텍스트 리스트 생성</div>

        <div class="right sort" style="position: relative;">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="right sort image">
            <div class="right sort text"><p></p></div>
        </div>
    </div>

    <div class="options"></div>
    <div class="image selector" style="display:none;">Display Images on Result: </div>
    <div class="time taken"></div>
    <div class="results"></div>

</div>
</body>

</html>
