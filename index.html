<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        /* 요청하신 스크린샷(015229.png)의 완벽한 박스 비율과 위치 재현 */
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 상단 배틀 정보 글씨 위치 및 크기 고정 */
        .progress-info {
            font-size: 12px;
            color: #000000;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* 메인 대결 레이아웃 */
        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin: 0 auto;
        }

        /* [수정] 요청하신 스크린샷과 100% 똑같은 컴팩트한 박스 크기(180x200) 세팅 */
        .sort-box {
            width: 180px;
            height: 200px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        /* 가운데 버튼 묶음 틀 */
        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 둘 다 좋다, 모르겠다 버튼 크기 보정 */
        .option-btn {
            width: 120px;
            height: 95px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        /* 결과 화면 디자인 */
        #resultArea {
            display: none;
            margin-top: 30px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 10px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        Battle No. 1<br>0% sorted.
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <h2>소터 결과 순위</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // [수정] 오직 플레이브 오리지널 공식 전곡 리스트로 전면 교체
    const songs = [
        "Wait For You", 
        "픽셀월드 (Pixel World)", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "Our Movie", 
        "From", 
        "Merry PLLImas", 
        "Way 4 Luv", 
        "WATCH ME WOO!", 
        "Virtual Idol", 
        "From (2024 Ver.)",
        "Pump Up The Volume!",
        "RIDGE (틈)"
    ];

    let leftIndex = 0;
    let rightIndex = 1;
    let battleNo = 1;
    let sortedCount = 0;
    let totalBattles = 0;
    let scoreMap = {};

    function initSorter() {
        songs.forEach(song => {
            scoreMap[song] = 0;
        });
        totalBattles = Math.ceil(songs.length * Math.log2(songs.length)) * 0.7;
        leftIndex = 0;
        rightIndex = 1;
        showBattle();
    }

    function showBattle() {
        document.getElementById("leftTitle").textContent = songs[leftIndex];
        document.getElementById("rightTitle").textContent = songs[rightIndex];

        let progress = Math.floor((sortedCount / totalBattles) * 100);
        if (progress > 99) progress = 99;
        if (progress < 0) progress = 0;

        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        let leftSong = songs[leftIndex];
        let rightSong = songs[rightIndex];

        if (choice === 1) {
            scoreMap[leftSong] += 2;
            scoreMap[rightSong] -= 1;
        } else if (choice === 2) {
            scoreMap[rightSong] += 2;
            scoreMap[leftSong] -= 1;
        } else if (choice === 0 || choice === -1) {
            scoreMap[leftSong] += 1;
            scoreMap[rightSong] += 1;
        }

        battleNo++;
        sortedCount++;
        rightIndex++;

        if (rightIndex >= songs.length) {
            leftIndex++;
            rightIndex = leftIndex + 1;
        }

        if (leftIndex >= songs.length - 1 || battleNo > totalBattles * 1.3) {
            finishSorter();
        } else {
            showBattle();
        }
    }

    function finishSorter() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        let rankedSongs = songs.map(song => {
            return { name: song, score: scoreMap[song] };
        }).sort((a, b) => b.score - a.score);

        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };
</script>
</body>
</html>
