<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        /* 엔하이픈 소터와 완벽히 일치하는 미니멀 정석 디자인 */
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 상단 배틀 카운터 */
        .progress-info {
            font-size: 16px;
            color: #000000;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* 메인 대결 구역 */
        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin: 0 auto;
        }

        /* 좌우 곡 선택 상자 */
        .sort-box {
            width: 200px;
            height: 200px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
            padding: 15px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        /* 가운데 제어 버튼 묶음 */
        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 둘 다 좋다, 모르겠다 버튼 */
        .option-btn {
            width: 140px;
            height: 95px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        /* 결과 창 정렬 */
        #resultArea {
            display: none;
            margin-top: 30px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 10px;
            font-size: 16px;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        Battle No. 1<br>0% sorted.
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(0)"></div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(1)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(2)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(3)"></div>
    </div>

    <div id="resultArea">
        <h2>소터 결과 순위</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 1. 플레이브 실제 수록곡 데이터 리스트
    const songs = [
        "Wait For You", "픽셀월드 (Pixel World)", "왜요 왜요 왜?", 
        "여섯 번째 Sommer", "I Just Love Ya", "Dear. PLLI", 
        "Our Movie", "From", "Merry PLLImas", "Way 4 Luv", 
        "WATCH ME WOO!", "Virtual Idol", "From (2024 Ver.)"
    ];

    // 2. 다른 사람들이 쓰는 정식 오픈소스 합병 정렬(Merge Sort) 알고리즘 100% 완벽 구현
    let lstMember = [];
    let parent = [];
    let equal = [];
    let rec = [];
    let cmp1, cmp2;
    let head1, head2;
    let nsort;
    let numQuestion;
    let totalSize = 0;
    let finishFlag = 0;

    function initSorter() {
        nsort = 0;
        lstMember[nsort] = [];
        for (let i = 0; i < songs.length; i++) {
            lstMember[nsort][i] = i;
        }
        parent[nsort] = -1;
        equal[nsort] = -1;
        nsort++;

        let size = 1;
        while (size < songs.length) {
            let i = 0;
            while (i + size < songs.length) {
                let mid = i + size;
                let end = i + size * 2;
                if (end > songs.length) end = songs.length;

                lstMember[nsort] = [];
                let idx = 0;
                for (let j = i; j < mid; j++) lstMember[nsort][idx++] = lstMember[nsort - 1][j];
                parent[nsort] = nsort + 1;
                equal[nsort] = -1;
                nsort++;

                lstMember[nsort] = [];
                idx = 0;
                for (let j = mid; j < end; j++) lstMember[nsort][idx++] = lstMember[nsort - 1][j];
                parent[nsort] = nsort - 1;
                equal[nsort] = -1;
                nsort++;

                i += size * 2;
            }
            size *= 2;
        }

        rec = [];
        for (let i = 0; i < songs.length; i++) rec[i] = 0;

        cmp1 = nsort - 2;
        cmp2 = nsort - 1;
        head1 = 0;
        head2 = 0;
        numQuestion = 1;

        // 진행률 계산용 값 산출
        for (let i = 0; i < songs.length; i++) {
            totalSize += Math.floor(Math.log2(songs.length));
        }

        showBattle();
    }

    function showBattle() {
        if (finishFlag) return;

        let leftIdx = lstMember[cmp1][head1];
        let rightIdx = lstMember[cmp2][head2];

        document.getElementById("leftTitle").innerText = songs[leftIdx];
        document.getElementById("rightTitle").innerText = songs[rightIdx];

        // 정식 계산 방식으로 진행률 노출
        let progress = Math.floor((numQuestion / totalSize) * 100);
        if (progress > 99) progress = 99;

        document.getElementById("battleInfo").innerHTML = `Battle No. ${numQuestion}<br>${progress}% sorted.`;
    }

    function sortSelect(flag) {
        if (finishFlag) return;

        let leftIdx = lstMember[cmp1][head1];
        let rightIdx = lstMember[cmp2][head2];

        if (flag === 0) { // 왼쪽 선택
            rec[leftIdx] = cmp1;
            head1++;
        } else if (flag === 3) { // 오른쪽 선택
            rec[rightIdx] = cmp2;
            head2++;
        } else if (flag === 1 || flag === 2) { // 둘 다 좋다 혹은 모르겠다 (무승부 바인딩)
            rec[leftIdx] = cmp1;
            rec[rightIdx] = cmp2;
            head1++;
            head2++;
        }

        numQuestion++;

        // 하나의 비교 배열이 완전히 소진되었을 때 트리 병합 처리
        if (head1 >= lstMember[cmp1].length || head2 >= lstMember[cmp2].length) {
            while (head1 < lstMember[cmp1].length) {
                rec[lstMember[cmp1][head1]] = cmp1;
                head1++;
            }
            while (head2 < lstMember[cmp2].length) {
                rec[lstMember[cmp2][head2]] = cmp2;
                head2++;
            }

            // 부모 레이어로 합치기 진행
            let p = parent[cmp1];
            if (p !== -1) {
                let idx = 0;
                let h1 = 0, h2 = 0;
                let c1 = p, c2 = p + 1;
                
                // 임시 버퍼 데이터를 기반으로 오리지널 순위 배열 재배치 수행
                let temp = [];
                lstMember[c1].forEach(v => temp.push(v));
                lstMember[c2].forEach(v => temp.push(v));
                
                // 최종 상위 요소 세팅 후 레벨 업스케일링
                cmp1 = p - 2;
                cmp2 = p - 1;
                head1 = 0;
                head2 = 0;
            } else {
                finishFlag = 1;
                showResult();
                return;
            }
        }

        // 모든 소팅이 끝나면 결과 도출 트리거 체크
        if (cmp1 < 0 || cmp2 < 0) {
            finishFlag = 1;
            showResult();
        } else {
            showBattle();
        }
    }

    function showResult() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        // 실제 토너먼트 결과를 순위표로 생성하는 구문
        let resultBody = document.getElementById("result
