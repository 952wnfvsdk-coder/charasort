<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>곡 소트 (Song Sorter)</title>
    <style>
        /* [수정] 오리지널 미니멀 디자인을 위한 전체적인 크기 및 위치 조정 */
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* [수정] 위치를 상단으로 올리기 위해 중앙 정렬 제거 및 상단 여백 추가 */
            justify-content: flex-start;
            padding-top: 40px;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            /* [수정] 전체 틀을 아주 작고 아담하게 고정 */
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* [수정] 상단 배틀 정보 글씨 크기를 아주 작게 축소 */
        .progress-info {
            font-size: 11px;
            color: #000000;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        /* 메인 대결 레이아웃 */
        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            /* [수정] 간격을 아주 좁게 설정 */
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        /* [수정] 좌우 곡 선택 상자를 아주 작고 컴팩트하게 축소 */
        .sort-box {
            width: 140px;
            height: 160px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            /* [수정] 내부 글씨 크기도 작게 축소 */
            font-size: 13px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        /* 가운데 버튼 묶음 틀 */
        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* [수정] 둘 다 좋다, 모르겠다 버튼 크기를 컴팩트하게 맞춤 */
        .option-btn {
            width: 100px;
            height: 77px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            /* [수정] 내부 글씨 크기를 작게 축소 */
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            padding: 8px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        /* 결과 화면 디자인 */
        #resultArea {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        Battle No. 1<br>0% sorted.
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <h2>소트 결과 순위</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 오리지널 곡 리스트 (New Emotions, Dangerous)
    const songs = [
        "New Emotions", 
        "Dangerous"
    ];

    let leftIndex = 0;
    let rightIndex = 1;
    let battleNo = 1;
    let sortedCount = 0;
    let totalBattles = 0;
    let scoreMap = {};

    function initSorter() {
        songs.forEach(song => {
            scoreMap[song] = 0;
        });
        totalBattles = Math.ceil(songs.length * Math.log2(songs.length)) * 0.7;
        leftIndex = 0;
        rightIndex = 1;
        showBattle();
    }

    function showBattle() {
        document.getElementById("leftTitle").textContent = songs[leftIndex];
        document.getElementById("rightTitle").textContent = songs[rightIndex];

        let progress = Math.floor((sortedCount / totalBattles) * 100);
        if (progress > 99) progress = 99;
        if (progress < 0) progress = 0;

        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        let leftSong = songs[leftIndex];
        let rightSong = songs[rightIndex];

        if (choice === 1) {
            scoreMap[leftSong] += 2;
            scoreMap[rightSong] -= 1;
        } else if (choice === 2) {
            scoreMap[rightSong] += 2;
            scoreMap[leftSong] -= 1;
        } else if (choice === 0 || choice === -1) {
            scoreMap[leftSong] += 1;
            scoreMap[rightSong] += 1;
        }

        battleNo++;
        sortedCount++;
        rightIndex++;

        if (rightIndex >= songs.length) {
            leftIndex++;
            rightIndex = leftIndex + 1;
        }

        if (leftIndex >= songs.length - 1 || battleNo > totalBattles * 1.3) {
            finishSorter();
        } else {
            showBattle();
        }
    }

    function finishSorter() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        let rankedSongs = songs.map(song => {
            return { name: song, score: scoreMap[song] };
        }).sort((a, b) => b.score - a.score);

        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };
</script>
</body>
</html>
