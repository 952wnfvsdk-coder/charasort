<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        .progress-info {
            font-size: 11px;
            color: #000000;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        .sort-box {
            width: 140px;
            height: 160px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            width: 100px;
            height: 77px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            padding: 8px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        #resultArea {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        로딩 중...
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <h2>소터 결과 순위</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 플레이브 현재 곡 목록 (나중에 곡을 마음껏 늘리셔도 100% 동시 교체됩니다!)
    const songs = [
        "Wait For You", 
        "픽셀월드 (Pixel World)", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "Our Movie", 
        "From", 
        "Merry PLLImas", 
        "Way 4 Luv", 
        "WATCH ME WOO!", 
        "Virtual Idol", 
        "From (2024 Ver.)",
        "Pump Up The Volume!",
        "RIDGE (틈)"
    ];

    let currentRoundSongs = []; // 현재 라운드 진행 중인 곡들
    let nextRoundSongs = [];    // 이겨서 다음 라운드로 올라간 곡들
    let droppedSongs = [];     // 떨어진 곡들 (순위 매기기용)
    
    let roundName = "";         // 16강, 8강 등 라운드 표시
    let matchIndex = 0;         // 현재 라운드의 몇 번째 매치인지
    let totalMatchesInRound = 0;// 현재 라운드의 총 매치 수
    let battleNo = 1;

    function initSorter() {
        // 1. 처음 시작할 때 곡 목록을 복사하고 무작위로 셔플
        currentRoundSongs = [...songs];
        for (let i = currentRoundSongs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [currentRoundSongs[i], currentRoundSongs[j]] = [currentRoundSongs[j], currentRoundSongs[i]];
        }
        
        // 15곡일 경우 1개 곡은 부전승으로 다음 라운드 미리 진출
        if (currentRoundSongs.length % 2 !== 0) {
            nextRoundSongs.push(currentRoundSongs.pop());
        }

        matchIndex = 0;
        totalMatchesInRound = currentRoundSongs.length / 2;
        updateRoundName();
        showBattle();
    }

    function updateRoundName() {
        let totalCount = currentRoundSongs.length + nextRoundSongs.length;
        if (totalCount > 8 && totalCount <= 16) roundName = "16강전";
        else if (totalCount > 4 && totalCount <= 8) roundName = "8강전";
        else if (totalCount > 2 && totalCount <= 4) roundName = "4강전";
        else if (totalCount === 2) roundName = "결승전";
    }

    function showBattle() {
        if (matchIndex >= totalMatchesInRound) {
            // 해당 라운드가 끝나면 다음 라운드로 전환
            currentRoundSongs = [...nextRoundSongs];
            nextRoundSongs = [];
            
            // 다음 라운드 대진도 랜덤하게 섞음
            for (let i = currentRoundSongs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentRoundSongs[i], currentRoundSongs[j]] = [currentRoundSongs[j], currentRoundSongs[i]];
            }

            if (currentRoundSongs.length === 1) {
                finishSorter();
                return;
            }

            // 홀수 번 남으면 또 1곡 부전승 처리
            if (currentRoundSongs.length % 2 !== 0) {
                nextRoundSongs.push(currentRoundSongs.pop());
            }

            matchIndex = 0;
            totalMatchesInRound = currentRoundSongs.length / 2;
            updateRoundName();
        }

        let leftSong = currentRoundSongs[matchIndex * 2];
        let rightSong = currentRoundSongs[matchIndex * 2 + 1];

        document.getElementById("leftTitle").textContent = leftSong;
        document.getElementById("rightTitle").textContent = rightSong;

        document.getElementById("battleInfo").innerHTML = `${roundName} - Match ${matchIndex + 1}<br>Battle No. ${battleNo}`;
    }

    function sortSelect(choice) {
        let leftSong = currentRoundSongs[matchIndex * 2];
        let rightSong = currentRoundSongs[matchIndex * 2 + 1];

        if (choice === 1) {
            nextRoundSongs.push(leftSong);      // 왼쪽 승리
            droppedSongs.unshift(rightSong);   // 오른쪽 탈락 (순위 높은 탈락자일수록 앞에 배치)
        } else if (choice === 2) {
            nextRoundSongs.push(rightSong);     // 오른쪽 승리
            droppedSongs.unshift(leftSong);    // 왼쪽 탈락
        } else {
            // 둘다 좋다/모르겠다일 경우 랜덤으로 한 명 올림
            if (Math.random() > 0.5) {
                nextRoundSongs.push(leftSong);
                droppedSongs.unshift(rightSong);
            } else {
                nextRoundSongs.push(rightSong);
                droppedSongs.unshift(leftSong);
            }
        }

        battleNo++;
        matchIndex++;
        showBattle();
    }

    function finishSorter() {
        document.getElementById("battleInfo").innerHTML = "소터 완료!<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        // 최종 우승곡을 맨 앞에 추가
        let finalRank = [currentRoundSongs[0], ...droppedSongs];

        finalRank.forEach((song, index) => {
            let row = `<tr><td>${index + 1}</td><td>${song}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };
</script>
</body>
</html>
