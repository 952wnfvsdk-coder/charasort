<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플레이브 곡 소터 (PLAVE Song Sorter)</title>
    <style>
        body {
            font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }

        .progress-info {
            font-size: 11px;
            color: #000000;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sorter-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        .sort-box {
            width: 140px;
            height: 160px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: normal;
            color: #000000;
            cursor: pointer;
            padding: 10px;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .middle-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            width: 100px;
            height: 77px;
            border: 1px solid #000000;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000000;
            cursor: pointer;
            padding: 8px;
            box-sizing: border-box;
        }

        .sort-box:hover, .option-btn:hover {
            background-color: #f7f7f7;
        }

        #resultArea {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .result-table {
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #000000;
            padding: 8px;
            font-size: 12px;
            text-align: center;
        }

        .result-table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-info" id="battleInfo">
        Battle No. 1<br>0% sorted.
    </div>

    <div class="sorter-table" id="sorterInterface">
        <div class="sort-box" id="leftTitle" onclick="sortSelect(1)">로딩 중...</div>
        <div class="middle-options">
            <div class="option-btn" onclick="sortSelect(0)">둘 다 좋다</div>
            <div class="option-btn" onclick="sortSelect(-1)">모르겠다</div>
        </div>
        <div class="sort-box" id="rightTitle" onclick="sortSelect(2)">로딩 중...</div>
    </div>

    <div id="resultArea">
        <h2>소터 결과 순위</h2>
        <table class="result-table">
            <thead>
                <tr>
                    <th style="width: 25%;">순위</th>
                    <th>곡 제목</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    const songs = [
        "Wait For You", 
        "픽셀월드 (Pixel World)", 
        "왜요 왜요 왜?", 
        "여섯 번째 여름", 
        "I Just Love Ya", 
        "Dear. PLLI", 
        "Our Movie", 
        "From", 
        "Merry PLLImas", 
        "Way 4 Luv", 
        "WATCH ME WOO!", 
        "Virtual Idol", 
        "From (2024 Ver.)",
        "Pump Up The Volume!",
        "RIDGE (틈)"
    ];

    let battleNo = 1;
    let scoreMap = {};
    let totalBattles = 0;
    let battlePairs = [];
    let currentPairIndex = 0;

    // 방금 대결에 등장했던 곡 번호 저장용 변수
    let lastLeftIdx = -1;
    let lastRightIdx = -1;

    function initSorter() {
        songs.forEach(song => { scoreMap[song] = 0; });

        for (let i = 0; i < songs.length; i++) {
            for (let j = i + 1; j < songs.length; j++) {
                if (Math.random() > 0.5) {
                    battlePairs.push([i, j]);
                } else {
                    battlePairs.push([j, i]);
                }
            }
        }

        // 초기 셔플
        for (let i = battlePairs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [battlePairs[i], battlePairs[j]] = [battlePairs[j], battlePairs[i]];
        }

        totalBattles = battlePairs.length;
        showBattle();
    }

    function showBattle() {
        if (currentPairIndex >= battlePairs.length) {
            finishSorter();
            return;
        }

        // [핵심 로직] 현재 대결에 방금 전 곡이 포함되어 있는지 검사
        let targetIndex = currentPairIndex;
        let pair = battlePairs[targetIndex];

        // 대결 리스트의 끝자락이 아니라면, 연속된 곡이 안 나오도록 뒤쪽 리스트 탐색
        while (targetIndex < battlePairs.length - 1 && 
              (pair[0] === lastLeftIdx || pair[0] === lastRightIdx || 
               pair[1] === lastLeftIdx || pair[1] === lastRightIdx)) {
            targetIndex++;
            pair = battlePairs[targetIndex];
        }

        // 만약 조건에 맞는 카드를 뒤에서 찾았다면, 현재 순서와 맞바꿈
        if (targetIndex !== currentPairIndex && targetIndex < battlePairs.length) {
            let temp = battlePairs[currentPairIndex];
            battlePairs[currentPairIndex] = battlePairs[targetIndex];
            battlePairs[targetIndex] = temp;
            pair = battlePairs[currentPairIndex];
        }

        // 현재 선택된 대결의 곡 번호를 기억
        lastLeftIdx = pair[0];
        lastRightIdx = pair[1];

        document.getElementById("leftTitle").textContent = songs[pair[0]];
        document.getElementById("rightTitle").textContent = songs[pair[1]];

        let progress = Math.floor((currentPairIndex / totalBattles) * 100);
        document.getElementById("battleInfo").innerHTML = `Battle No. ${battleNo}<br>${progress}% sorted.`;
    }

    function sortSelect(choice) {
        if (currentPairIndex >= totalBattles) return;

        let pair = battlePairs[currentPairIndex];
        let leftSong = songs[pair[0]];
        let rightSong = songs[pair[1]];

        if (choice === 1) {
            scoreMap[leftSong] += 2;
            scoreMap[rightSong] -= 1;
        } else if (choice === 2) {
            scoreMap[rightSong] += 2;
            scoreMap[leftSong] -= 1;
        } else {
            scoreMap[leftSong] += 1;
            scoreMap[rightSong] += 1;
        }

        battleNo++;
        currentPairIndex++;
        showBattle();
    }

    function finishSorter() {
        document.getElementById("battleInfo").innerHTML = "Battle No. End<br>100% sorted.";
        document.getElementById("sorterInterface").style.display = "none";

        let resultBody = document.getElementById("resultBody");
        resultBody.innerHTML = "";

        let rankedSongs = songs.map(song => {
            return { name: song, score: scoreMap[song] };
        }).sort((a, b) => b.score - a.score);

        rankedSongs.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.name}</td></tr>`;
            resultBody.innerHTML += row;
        });

        document.getElementById("resultArea").style.display = "block";
    }

    window.onload = function() {
        initSorter();
    };
</script>
</body>
</html>
